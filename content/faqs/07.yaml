question: "Qual a diferença entre Crispy Wise Whey e Crispy Wise Vegan?"
answer: "O Crispy Wise Whey usa proteína concentrada do soro do leite (whey protein) e contém lactose. O Crispy Wise Vegan usa proteína isolada de ervilha combinada com farinha de arroz, é zero lactose e adequado para veganos. Ambos têm sabor neutro, mesma textura crocante e 18g de proteína por porção de 30g."
