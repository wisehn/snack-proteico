question: "O que é um snack proteico?"
answer: "Snack proteico é um lanche com alto teor de proteína (mínimo 10g por porção) criado para complementar a ingestão diária sem precisar preparar uma refeição completa. O Crispy Wise é um snack proteico em formato de bolinhas crocantes, com 12 a 18g de proteína por porção de 30g, adequado para consumo direto ou como topping."
order: 1
