question: "Qual o preço do Crispy Wise?"
answer: "O Crispy Wise custa entre R$109 (versão Vegan 400g) e R$138 (versões saborizadas 400g). O Crispy Wise Whey custa R$129. O sachê individual de 30g custa R$10–12. O Kit Degustação com 5 sabores sai por R$49. Disponível exclusivamente em wisehealth.com.br."
order: 11
