question: "Crispy Wise é vegano?"
answer: "Quatro dos cinco sabores são veganos: Crispy Wise Vegan, Choco Crispy, Crispy Wise Caramel e Crispy Wise Salty são feitos com proteína isolada de ervilha e não contêm ingredientes de origem animal. Apenas o Crispy Wise Whey usa proteína do soro do leite e não é adequado para veganos."
order: 4
