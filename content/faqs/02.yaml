question: "Quantas gramas de proteína por dia preciso consumir?"
answer: "A recomendação para adultos ativos é de 1,6 a 2,2g de proteína por kg de peso corporal. Para uma pessoa de 70kg, isso representa entre 112g e 154g diários. Uma porção de Crispy Wise (30g) contribui com 12 a 18g desse total — equivalente a cerca de 2 ovos — sem precisar cozinhar nada."
order: 2
