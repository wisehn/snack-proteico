question: "Crispy Wise tem glúten?"
answer: "Não. Todas as versões Crispy Wise são sem glúten. A formulação utiliza farinha de arroz em vez de trigo. Os produtos são fabricados em ambiente que pode conter glúten (por isso o aviso de contaminação cruzada na embalagem), mas o produto em si é livre de glúten."
order: 6
